[Grid]
X1-grid    1  0.0  128  u  2.0
X2-grid    1 -14.0 1024  u  2.0

[TimeIntegrator]
CFL         0.3
tstop       15.0
first_dt    1.e-5
nstages     2

[Hydro]
solver      hllc
gamma       1.6666667

[Boundary]
X1-beg      reflective
X1-end      outflow
X2-beg      outflow
X2-end      userdef

[Units]
length      3.08568e18    #1pc
velocity    1.0e8         # 1e3 km/s
density     1.67262e-24   #1 mp/cc

[Setup]
Mbh         2.0e7       # solar masses
vbh         1.0         # code units
epsilon     0.05        # pc (softening length 0.1 R_bondi)
n_cgm       1.0e-3      # m_p/cc
sink_rat    1.0e-2
T_cgm       1.0e6       # Kelvin
mu          0.6

[Output]
vtk    0.1
dmp    1.0
log    100
analysis 0.01
