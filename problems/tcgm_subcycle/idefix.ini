[Grid]
X1-grid    1  0.0  512   u  4.0
X2-grid    1 -60.0 8192  u  4.0

[TimeIntegrator]
CFL         0.3
tstop       120.0    #Myr
first_dt    1.e-5
nstages     2

[Hydro]
solver      hllc
gamma       1.6666667
cooling     ism
tracer      1

[Boundary]
X1-beg      reflective
X1-end      outflow
X2-beg      outflow
X2-end      userdef

[Units]
length      3.08568e21    # 1kpc
velocity    1.0e8         # 1e3 km/s
density     1.67262e-24   # 1 mp/cc

[Cooling]
mu          0.6
subcycle    yes
mask_tracer 0           # no cooling where wind fraction < mask_threshold (pure CGM)
mask_threshold 1.0e-3
Tfloor      1.0e4       # K
heating     0.0

[Setup]
Mbh         2.0e7       # solar masses
vbh         1.0         # code units
epsilon     5e-5        # kpc (softening length 0.1 R_bondi)
n_cgm0      10.0        # m_p/cc, CGM density at t=0
dt_ncgm     10.0        # code time (0.978 Myr): n_cgm(t) = n_cgm0*exp(-t/dt_ncgm)
T_cgm       1.0e6       # Kelvin
Mdot0       1.0e-3      # Msun/yr, wind mass-loss rate at t=0
dt_mdot     10.0        # code time: Mdot(t) = Mdot0*exp(t/dt_mdot)
vw          0.1         # 100km/s
rinj        0.1         # kpc


[Output]
vtk    1.0
dmp    10.0
log    10000
