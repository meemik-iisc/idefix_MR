[Grid]
X1-grid    3   0.0     50 u 0.05   135 s- 0.5   448 u 4.0
X2-grid    5  -60.0  7616 u -0.5   135 s+ -0.05  100 u 0.05  135 s- 0.5  448 u 4.0


[TimeIntegrator]
CFL         0.3
tstop       60.0    #Myr
first_dt    1.e-5
nstages     2

[Hydro]
solver      hllc
gamma       1.6666667
cooling     ism
tracer      1

[Boundary]
X1-beg      reflective
X1-end      outflow
X2-beg      outflow
X2-end      userdef

[Units]
length      3.08568e21    # 1kpc
velocity    1.0e8         # 1e3 km/s
density     1.67262e-24   # 1 mp/cc

[Cooling]
mu          0.6
subcycle    yes
nsub_max    1000
cool_cfl    0.1
mask_tracer 0           # no cooling where wind fraction < mask_threshold (pure CGM)
mask_threshold 1.0e-3
Tfloor      1.0e4       # K
heating     0.0

[Setup]
Mbh         2.0e7       # solar masses
vbh         1.0         # code units
epsilon     1e-5        # kpc (softening length 0.1 R_bondi)
n_cgm0      10.0        # m_p/cc, CGM density at t=0
dt_ncgm     5.0         # Myr
T_cgm       1.0e6       # Kelvin
Mdot0       0.1         # Msun/yr, wind mass-loss rate at t=0
dt_mdot     25.0        # code time: Mdot(t) = Mdot0*exp(t/dt_mdot)
vw0         5.0         # 5000km/s
dt_vw       15.0        # Myr
rinj        5.0e-3      # 5pc

[Turb]
sigv        30.0        # km/s
Rnorm       1.0         # kpc, = R_max: volume-averaged sigma_v
lmin        0.125       # kpc, 16 cells
lmax        2.0         # kpc, R_max/2
Lz          128.0       # kpc, > vbh*tstop + box height = 124
seed        1234       


[Output]
vtk    1.0
dmp    10.0
log    10000
