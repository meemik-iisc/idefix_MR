[Grid]
X1-grid    1  0.0  512   u  4.0
X2-grid    1 -60.0 8192  u  4.0

[TimeIntegrator]
CFL         0.3
tstop       60.0    #Myr
first_dt    1.e-5
nstages     2

[Hydro]
solver      hllc
gamma       1.6666667
cooling     ism

[Boundary]
X1-beg      reflective
X1-end      outflow
X2-beg      outflow
X2-end      userdef

[Units]
length      3.08568e21    # 1kpc
velocity    1.0e8         # 1e3 km/s
density     1.67262e-24   # 1 mp/cc

[Cooling]
mu          0.6
subcycle    yes
nsub_max    1000
cool_cfl    0.1
Tfloor      1.0e4       # K
heating     0.0

[Setup]
vbh         1.0         # code units
n_cgm       1.0e-3      # cm^{-3}, CGM density at t=0
T_cgm       1.0e6       # Kelvin

[Turb]
sigv        30.0        # km/s  (see note on line 67)
Rnorm       4.0         # kpc, = R_max: volume-averaged sigma_v
lmin        0.125       # kpc, 16 cells
lmax        2.0         # kpc, R_max/2
Lz          128.0       # kpc, > vbh*tstop + box height = 124
seed        1234       


[Output]
vtk    1.0
dmp    10.0
log    10000
